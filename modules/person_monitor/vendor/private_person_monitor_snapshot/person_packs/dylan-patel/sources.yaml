schema_version: 0.1.0
person_slug: dylan-patel

defaults:
  schedule: daily
  lookback_overlap_hours: 48
  manual_url_is_primary: false
  manual_url_mode: advanced_fallback

# M1 首次来源研究后由主 Agent 填入已验证的固定频道；
# 目录搜索和关键词搜索只是扩展发现，不替代稳定订阅源。
